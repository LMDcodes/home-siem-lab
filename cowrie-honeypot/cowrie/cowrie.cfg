# Minimal Cowrie overrides; anything not set here uses cowrie.cfg.dist defaults.

[honeypot]
# What attackers see at the prompt. Pick something boring and believable.
hostname = srv-db02
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
# Drop idle sessions so the lab doesn't accumulate connections.
interactive_timeout = 180
authentication_timeout = 120

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
# Look like a stock Ubuntu box.
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.10

[telnet]
enabled = false

[output_jsonlog]
# This is the file the Wazuh agent tails.
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false
